<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Sicherheit Nord" />
    <meta name="theme-color" content="#07545a" />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sicherheit Nord" />
    <meta property="og:title" content="Sicherheit Nord · Ausweisscan" />
    <meta
      property="og:url"
      content="https://sicherheit-nord-ausweisscan.web.app/"
    />
    <link rel="canonical" href="https://sicherheit-nord-ausweisscan.web.app/" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; connect-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'"
    />
    <title>Sicherheit Nord · Ausweisscan</title>
    <script src="./legacy-redirect.js?v=20261009-finish-recovery-v13"></script>
    <link rel="stylesheet" href="./styles.css?v=20261009-finish-recovery-v13" />
    <script
      type="module"
      src="./scanner.js?v=20261009-finish-recovery-v13"
    ></script>
  </head>
  <body>
    <main id="app" class="app" aria-busy="true">
      <section id="loading" class="loading" aria-live="polite">
        <img
          class="loading-logo"
          src="./sicherheit-nord-logo.png"
          alt="Sicherheit Nord"
        />
        <p>Sichere Verbindung wird hergestellt …</p>
      </section>

      <section
        id="dashboard"
        class="dashboard"
        hidden
        aria-labelledby="dashboard-title"
      >
        <div class="dashboard-card">
          <img
            class="brand-logo"
            src="./sicherheit-nord-logo.png"
            alt="Sicherheit Nord"
          />
          <div class="dashboard-heading">
            <h1 id="dashboard-title" tabindex="-1">Dokumentauswahl</h1>
          </div>

          <div id="document-list" class="document-list">
            <button
              class="document-card"
              type="button"
              data-document="identity-card"
            >
              <span class="document-copy">
                <strong>Personalausweis</strong>
              </span>
              <span class="document-status is-open" data-status
                >Auswählbar</span
              >
            </button>
            <button
              class="document-card"
              type="button"
              data-document="passport"
            >
              <span class="document-copy">
                <strong>Reisepass</strong>
              </span>
              <span class="document-status is-open" data-status
                >Auswählbar</span
              >
            </button>
            <button
              class="document-card"
              type="button"
              data-document="health-card"
            >
              <span class="document-copy">
                <strong>Krankenkassenkarte</strong>
              </span>
              <span class="document-status is-open" data-status
                >Auswählbar</span
              >
            </button>
            <button
              id="tax-id-card"
              class="document-card"
              type="button"
              data-document="tax-id"
              hidden
            >
              <span class="document-copy">
                <strong>Steueridentifikationsnummer</strong>
              </span>
              <span class="document-status is-open" data-status
                >Auswählbar</span
              >
            </button>
          </div>

          <div id="document-finish" class="document-finish">
            <button id="finish-session" class="primary" type="button" disabled>
              Fertig
            </button>
            <p
              id="dashboard-status"
              class="dashboard-status"
              aria-live="polite"
            ></p>
          </div>
        </div>
      </section>

      <section
        id="tax-id-stage"
        class="dashboard tax-id-stage"
        hidden
        aria-labelledby="tax-id-title"
      >
        <div class="dashboard-card tax-id-card">
          <button id="tax-id-back" class="tax-id-back" type="button">
            Übersicht
          </button>
          <div class="dashboard-heading">
            <h1 id="tax-id-title" tabindex="-1">Steueridentifikationsnummer</h1>
          </div>

          <div id="tax-id-methods" class="tax-id-methods">
            <button id="tax-id-type" class="primary" type="button">
              Eingeben
            </button>
            <button id="tax-id-photo" class="secondary" type="button">
              Dokument fotografieren
            </button>
          </div>

          <form id="tax-id-form" class="tax-id-form" hidden novalidate>
            <label for="tax-id-input"
              >11-stellige Steueridentifikationsnummer</label
            >
            <input
              id="tax-id-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="done"
              maxlength="18"
              aria-describedby="tax-id-error"
            />
            <p id="tax-id-error" class="tax-id-error" aria-live="polite"></p>
            <button id="tax-id-submit" class="primary" type="submit">
              Übernehmen
            </button>
          </form>

          <input
            id="tax-id-photo-input"
            class="visually-hidden"
            type="file"
            accept="image/*"
            capture="environment"
            tabindex="-1"
            aria-hidden="true"
          />
        </div>
      </section>

      <section
        id="camera-stage"
        class="camera-stage"
        hidden
        tabindex="-1"
        aria-label="Kamerabild"
      >
        <video id="camera" autoplay muted playsinline></video>
        <div class="shade" aria-hidden="true"></div>
        <button
          id="back-to-dashboard"
          class="camera-action back-to-dashboard"
          type="button"
          hidden
        >
          Übersicht
        </button>
        <button
          id="torch-toggle"
          class="camera-action torch-toggle"
          type="button"
          hidden
          aria-pressed="false"
        >
          Licht an
        </button>
        <div id="id-guide" class="id-guide is-red" aria-hidden="true">
          <span class="guide-orientation">OBERKANTE</span>
          <span class="corner top-left"></span>
          <span class="corner top-right"></span>
          <span class="corner bottom-left"></span>
          <span class="corner bottom-right"></span>
        </div>
        <div id="countdown" class="countdown" aria-live="assertive"></div>
        <div class="camera-copy">
          <p id="side-label" class="side-label">Vorderseite Personalausweis</p>
          <p id="camera-status" class="camera-status" aria-live="polite"></p>
        </div>
        <button
          id="start-camera"
          class="primary start-camera"
          type="button"
          hidden
        >
          Kamera erlauben
        </button>
      </section>

      <section id="review" class="review" hidden aria-labelledby="review-title">
        <div class="review-card">
          <h1 id="review-title" tabindex="-1">Vorderseite Personalausweis</h1>
          <div class="preview-frame">
            <img id="preview" alt="Vorschau der erfassten Dokumentenseite" />
          </div>
          <label class="consent">
            <input id="consent" type="checkbox" />
            <span id="consent-label"
              >Angaben lesbar – Dokumentenkopie bestätigen.</span
            >
          </label>
          <button id="use-capture" class="primary" type="button" disabled>
            Aufnahme verwenden
          </button>
          <button id="repeat-capture" class="secondary" type="button">
            Neu aufnehmen
          </button>
          <div id="upload-progress" class="progress" hidden>
            <span></span>
          </div>
          <p id="review-status" class="review-status" aria-live="polite"></p>
        </div>
      </section>

      <section id="fatal" class="fatal" hidden tabindex="-1">
        <div class="fatal-card">
          <h1>Scan nicht möglich</h1>
          <p id="fatal-message"></p>
        </div>
      </section>

      <section id="complete" class="complete" hidden tabindex="-1">
        <div class="complete-card">
          <div class="done-mark">✓</div>
          <h1>Fertig</h1>
          <p>Übertragung abgeschlossen.</p>
        </div>
      </section>

      <canvas id="analysis-canvas" hidden></canvas>
      <canvas id="capture-canvas" hidden></canvas>
    </main>
  </body>
</html>
