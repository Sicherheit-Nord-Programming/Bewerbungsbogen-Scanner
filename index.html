<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Sicherheit Nord" />
    <meta name="theme-color" content="#07545a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; connect-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'"
    />
    <title>Sicherheit Nord · Ausweisscan</title>
    <link rel="stylesheet" href="./styles.css?v=20261003-lean-scan" />
    <script type="module" src="./scanner.js?v=20261003-lean-scan"></script>
  </head>
  <body>
    <main id="app" class="app" aria-busy="true">
      <section id="camera-stage" class="camera-stage" aria-label="Kamerabild">
        <video id="camera" autoplay muted playsinline></video>
        <div class="shade" aria-hidden="true"></div>
        <div id="id-guide" class="id-guide is-red" aria-hidden="true">
          <span class="guide-orientation">OBERKANTE</span>
          <span class="corner top-left"></span>
          <span class="corner top-right"></span>
          <span class="corner bottom-left"></span>
          <span class="corner bottom-right"></span>
        </div>
        <div id="countdown" class="countdown" aria-live="assertive"></div>
        <div class="camera-copy">
          <p id="side-label" class="side-label">Vorderseite Personalausweis</p>
          <p id="camera-status" class="visually-hidden" aria-live="polite"></p>
        </div>
        <button
          id="start-camera"
          class="primary start-camera"
          type="button"
          hidden
        >
          Kamera erlauben
        </button>
      </section>

      <section id="review" class="review" hidden aria-labelledby="review-title">
        <div class="review-card">
          <h1 id="review-title">Vorderseite Personalausweis</h1>
          <div class="preview-frame">
            <img id="preview" alt="Vorschau der erfassten Ausweisseite" />
          </div>
          <label class="consent">
            <input id="consent" type="checkbox" />
            <span>Angaben lesbar – Ausweiskopie bestätigen.</span>
          </label>
          <button id="use-capture" class="primary" type="button" disabled>
            Aufnahme verwenden
          </button>
          <button id="repeat-capture" class="secondary" type="button">
            Neu aufnehmen
          </button>
          <div id="upload-progress" class="progress" hidden>
            <span></span>
          </div>
          <p id="review-status" class="review-status" aria-live="polite"></p>
        </div>
      </section>

      <section id="fatal" class="fatal" hidden>
        <div class="fatal-card">
          <h1>Scan nicht möglich</h1>
          <p id="fatal-message"></p>
        </div>
      </section>

      <section id="complete" class="complete" hidden>
        <div class="complete-card">
          <div class="done-mark">✓</div>
          <h1>Fertig</h1>
          <p>Zum Laptop zurückkehren.</p>
        </div>
      </section>

      <canvas id="analysis-canvas" hidden></canvas>
      <canvas id="capture-canvas" hidden></canvas>
    </main>
  </body>
</html>
